name: Schemity Migration Check
description: Reports what the SQL migrations in a pull request do to existing data and to the schema, without a database.
author: Schemity
branding:
  icon: database
  color: blue

inputs:
  dialect:
    description: postgres, mysql, mariadb, sqlserver, sqlite, snowflake or cockroachdb.
    required: true
  migrations:
    description: The folder that holds the SQL migration files.
    required: true
  command:
    description: analyze (what the statements do), lint (design findings the change introduces) or check (both).
    default: check
  schema:
    description: >-
      A schema dump to start from (pg_dump --schema-only, structure.sql), for a
      history that cannot be replayed from the first migration. With it, older
      migrations are not replayed unless `before` says which.
    default: ''
  before:
    description: >-
      Older migrations that build the schema the change runs against, one path
      per line. Defaults to the migrations folder, or to nothing when `schema`
      is set.
    default: ''
  files:
    description: >-
      The migration files to check, one per line. Defaults to the files the
      pull request adds or changes under the migrations folder.
    default: ''
  fail-on:
    description: >-
      Fail the job when the report holds any of these, separated by commas: any,
      impact, lint, unread, loses-data, can-fail, storage-engine, rewrites-table,
      holds-back, dependents, spreads, changes-data. Empty never fails.
    default: ''
  version:
    description: The CLI release to use, such as v0.1.0. Defaults to the latest.
    default: latest
  comment:
    description: >-
      true posts the report as one comment on the pull request, updated on
      every push. Needs `pull-requests: write`.
    default: 'false'
  token:
    description: Lists the pull request's files, and posts the comment when `comment` is true.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download schemity
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=schemity-x86_64-unknown-linux-musl.tar.gz ;;
          Linux-ARM64) asset=schemity-aarch64-unknown-linux-musl.tar.gz ;;
          macOS-ARM64) asset=schemity-aarch64-apple-darwin.tar.gz ;;
          *) echo "::error::No schemity build for $RUNNER_OS $RUNNER_ARCH. Run this job on a Linux runner (ubuntu-latest)."; exit 1 ;;
        esac
        if [ "$VERSION" = "latest" ]; then
          base=https://github.com/schemity/ci/releases/latest/download
        else
          base="https://github.com/schemity/ci/releases/download/$VERSION"
        fi
        dir="$RUNNER_TEMP/schemity"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL --retry 3 -o "$asset" "$base/$asset"
        curl -fsSL --retry 3 -o checksums.txt "$base/checksums.txt"
        want=$(grep " $asset\$" checksums.txt | cut -d' ' -f1)
        if command -v sha256sum >/dev/null; then
          got=$(sha256sum "$asset" | cut -d' ' -f1)
        else
          got=$(shasum -a 256 "$asset" | cut -d' ' -f1)
        fi
        if [ -z "$want" ] || [ "$want" != "$got" ]; then
          echo "::error::Checksum of $asset does not match checksums.txt"
          exit 1
        fi
        tar -xzf "$asset"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Check migrations
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIALECT: ${{ inputs.dialect }}
        MIGRATIONS: ${{ inputs.migrations }}
        COMMAND: ${{ inputs.command }}
        SCHEMA: ${{ inputs.schema }}
        BEFORE: ${{ inputs.before }}
        FILES: ${{ inputs.files }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        folder="${MIGRATIONS%/}"
        files=()
        if [ -n "$FILES" ]; then
          while IFS= read -r f; do [ -n "$f" ] && files+=("$f"); done <<< "$FILES"
        elif [ -n "$PR_NUMBER" ]; then
          # Asked of GitHub, so the checkout needs no history.
          while IFS= read -r f; do
            case "$f" in
              # A down file reverses a migration (golang-migrate, sqlx,
              # Diesel, a Flyway undo); it is not one that will run.
              */down.sql|*.down.sql|*.DOWN.SQL|*/U[0-9]*__*.sql) ;;
              "$folder"/*.sql|"$folder"/*.SQL) [ -f "$f" ] && files+=("$f") ;;
            esac
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status != "removed") | .filename')
        else
          echo "::error::Not a pull request: set the 'files' input to the migration files to check."
          exit 1
        fi
        report="$RUNNER_TEMP/schemity/report.txt"
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No migration files changed under $folder." | tee "$report"
          touch "$RUNNER_TEMP/schemity/no-files"
          exit 0
        fi

        args=("$COMMAND" --dialect "$DIALECT")
        [ -n "$SCHEMA" ] && args+=(--schema "$SCHEMA")
        if [ -n "$BEFORE" ]; then
          while IFS= read -r b; do [ -n "$b" ] && args+=(--before "$b"); done <<< "$BEFORE"
        elif [ -z "$SCHEMA" ]; then
          args+=(--before "$folder")
        fi

        # The same report twice: readable in the job summary (and the pull
        # request comment), and as notices on the changed lines. Only the
        # second decides the job's result.
        schemity "${args[@]}" "${files[@]}" > "$report"
        {
          echo '### Schemity migration check'
          echo
          echo '```'
          cat "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        schemity "${args[@]}" --format github "${files[@]}"

    # Runs when the check failed the job too: a failing report is the one most
    # worth reading on the pull request.
    - name: Comment on the pull request
      if: ${{ !cancelled() && inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/schemity/report.txt"
        # The check stopped before it had a report (an unreadable input).
        [ -f "$report" ] || exit 0
        marker='<!-- schemity-migration-check -->'
        existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id")
        existing="${existing%%$'\n'*}"
        # No migrations in this pull request: say so only where an earlier
        # push left a report that no longer applies.
        if [ -f "$RUNNER_TEMP/schemity/no-files" ] && [ -z "$existing" ]; then
          exit 0
        fi
        # What the files cannot say about this report's findings, asked of
        # the one place that can answer it: the database.
        asks=()
        grep -qx 'Loses data' "$report" && asks+=("how many rows lose data")
        grep -qx 'Can fail on existing data' "$report" && asks+=("how many rows would make it fail")
        grep -qxE 'Rewrites the table|Holds back other statements' "$report" && asks+=("how big the tables it rewrites or locks are, which decides seconds or minutes")
        link='https://schemity.com/schema-migration-impact-analysis/?utm_source=github&utm_medium=pr-comment&utm_campaign=migration-check'
        footer="Checked from the migration files alone, with no database."
        case ${#asks[@]} in
          0) footer+=" Row counts and table sizes come from a live connection in [Schemity]($link)." ;;
          1) footer+=" Open this migration in [Schemity]($link) against staging or production to see ${asks[0]}." ;;
          2) footer+=" Open this migration in [Schemity]($link) against staging or production to see ${asks[0]} and ${asks[1]}." ;;
          *) footer+=" Open this migration in [Schemity]($link) against staging or production to see ${asks[0]}, ${asks[1]}, and ${asks[2]}." ;;
        esac
        footer+=" Run by [schemity/ci](https://github.com/schemity/ci)."
        body="$RUNNER_TEMP/schemity/comment.md"
        {
          echo "$marker"
          echo '### Schemity migration check'
          echo
          echo '```'
          # A comment holds 65,536 characters; the job summary keeps the rest.
          head -c 60000 "$report"
          [ "$(wc -c < "$report")" -gt 60000 ] && printf '\n[cut short: the full report is in the job summary]\n'
          echo '```'
          echo
          echo "$footer"
        } > "$body"
        if [ -n "$existing" ]; then
          request=(-X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing")
        else
          request=(-X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments")
        fi
        if ! gh api "${request[@]}" -F "body=@$body" > /dev/null; then
          echo "::warning::Could not comment on the pull request. A pull request from a fork gets a read-only token, and otherwise the job needs 'pull-requests: write'. The report is in the job summary."
        fi
